# Stack: Mosquitto (MQTT/TLS) -> Telegraf -> InfluxDB 2.x -> Grafana (+ API)
# Utilização: copiar .env.example para .env, preencher, e executar: docker compose up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports: ["8883:8883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: qualidade_ar
      DOCKER_INFLUXDB_INIT_RETENTION: 365d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx_data:/var/lib/influxdb2

  telegraf:
    image: telegraf:1.30
    restart: unless-stopped
    depends_on: [mosquitto, influxdb]
    environment:
      MQTT_USER: telegraf
      MQTT_PASSWORD: ${MQTT_TELEGRAF_PASSWORD}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./certs/ca.crt:/etc/telegraf/ca.crt:ro

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on: [influxdb]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # painel público só de leitura
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports: ["8000:8000"]
    depends_on: [influxdb]
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_BUCKET: qualidade_ar

volumes:
  mosquitto_data:
  influx_data:
  grafana_data:
