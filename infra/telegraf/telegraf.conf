[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["ssl://mosquitto:8883"]
  topics  = ["amora/setubal/+/medicoes"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  tls_ca = "/etc/telegraf/ca.crt"
  data_format = "json_v2"
  name_override = "qualidade_ar"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "amora/setubal/+/medicoes"
    tags  = "_/local/estacao/_"

  [[inputs.mqtt_consumer.json_v2]]
    # Usa o campo "ts" (UTC, segundos) como carimbo temporal, se existir
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pm25"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pm10"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pm25_raw"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pm10_raw"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperatura"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "humidade"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pressao"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gas_kohm"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rssi"
      type = "int"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "qualidade_ar"
